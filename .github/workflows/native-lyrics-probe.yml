name: Investigar parser nativo de letras
on:
  push:
    branches: [main]
    paths:
      - research/native_lyrics/**
      - .github/workflows/native-lyrics-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar lector de etiquetas para el generador sintético
        run: python -m pip install mutagen==1.47.0
      - name: Comprobar que el informe no produce falsos positivos
        run: python -m unittest discover -s research/native_lyrics -p test_probe.py -v
      - name: Preparar casos sin música ni datos del usuario
        run: python research/native_lyrics/make_cases.py native-lyrics-cases.json
      - name: Compilar sonda de solo lectura
        run: clang -fobjc-arc -Wall -Wextra -framework Foundation research/native_lyrics/probe.m -o NativeLyricsProbe
      - name: Probar parser de Apple, sin abrir ni modificar Música
        run: python research/native_lyrics/run_probe.py ./NativeLyricsProbe native-lyrics-cases.json native-lyrics-report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Native-lyrics-parser-report
          path: native-lyrics-report
          if-no-files-found: warn
