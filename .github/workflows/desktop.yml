name: Crear EXE y DMG

on:
  push:
    branches: [main, 'desarrollo/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows 11 · EXE x64
            artifact: Importios-Windows-x64
            binary: dist/Importios.exe
            download: dist/Importios.exe
          - os: macos-15
            label: macOS · DMG Apple Silicon
            artifact: Importios-macOS-AppleSilicon
            binary: dist/Importios.app/Contents/MacOS/Importios
            download: dist/Importios-macOS-arm64.dmg
          - os: macos-15-intel
            label: macOS · DMG Intel
            artifact: Importios-macOS-Intel
            binary: dist/Importios.app/Contents/MacOS/Importios
            download: dist/Importios-macOS-x86_64.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-desktop.txt
      - name: Instalar herramientas de compilación
        run: python -m pip install -r requirements-build.txt
      - name: Probar lectura de audio y aplicación
        run: python -m unittest discover -s tests -v
      - name: Crear aplicación y disco de instalación
        run: python scripts/build_desktop.py
      - name: Probar ejecutable real
        run: python scripts/smoke_desktop.py "${{ matrix.binary }}"
      - name: Guardar descarga
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.download }}
          if-no-files-found: error
          retention-days: 30
      - name: Guardar información de componentes
        if: always()
        shell: bash
        run: python -m pip freeze > componentes.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Componentes-${{ matrix.artifact }}
          path: componentes.txt

  release:
    name: Publicar versión descargable
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Importios-*
          path: downloads
          merge-multiple: true
      - name: Publicar EXE y DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" downloads/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Importios $GITHUB_REF_NAME" \
            --notes "Aplicación nativa para Windows y macOS. M4A con AAC/ALAC, miniaturas de portadas y lector de biblioteca del iPhone en modo de solo lectura. Lectura USB pendiente de verificar con un iPhone físico; la importación a Música todavía no está integrada. No requiere instalar Python. Paquetes sin firma de desarrollador ni notarización de Apple." \
            --prerelease \
            --verify-tag
