name: Crear EXE y DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows 11 · EXE x64
            artifact: TUPAQ-Windows-x64
            binary: dist/TUPAQ.exe
            download: dist/TUPAQ.exe
          - os: macos-15
            label: macOS · DMG Apple Silicon
            artifact: TUPAQ-macOS-AppleSilicon
            binary: dist/TUPAQ.app/Contents/MacOS/TUPAQ
            download: dist/TUPAQ-macOS-arm64.dmg
          - os: macos-15-intel
            label: macOS · DMG Intel
            artifact: TUPAQ-macOS-Intel
            binary: dist/TUPAQ.app/Contents/MacOS/TUPAQ
            download: dist/TUPAQ-macOS-x86_64.dmg
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-desktop.txt
      - name: Instalar herramientas de compilación
        run: python -m pip install -r requirements-build.txt
      - name: Usar la rueda oficial de cifrado en macOS
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        # Runner images can contain a Homebrew-linked cryptography build. Its
        # OpenSSL dylib collides with Python's bundled one after freezing.
        run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps cryptography==50.0.2
      - name: Compilar cifrado con OpenSSL estático en Mac Intel
        if: runner.os == 'macOS' && runner.arch == 'X64'
        # cryptography 49+ no longer ships Intel macOS wheels. Keep the current
        # release and link OpenSSL statically to avoid conflicting dylibs.
        env:
          OPENSSL_STATIC: '1'
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          python -m pip install --force-reinstall --no-deps --no-binary=cryptography --no-cache-dir cryptography==50.0.2
      - name: Probar lectura de audio y aplicación
        run: python scripts/run_tests.py
      - name: Comprobar desplegables Win32 sin marco antiguo
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python scripts/check_native_popup.py --output preview-ui/native-popups
      - name: Renderizar vistas nativas con datos sintéticos
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/preview_desktop.py --output preview-ui
      - uses: actions/upload-artifact@v6
        with:
          name: Vistas-${{ matrix.artifact }}
          path: preview-ui
          if-no-files-found: error
          retention-days: 30
      - name: Crear aplicación y disco de instalación
        run: python scripts/build_desktop.py
      - name: Probar ejecutable real
        run: python scripts/smoke_desktop.py "${{ matrix.binary }}"
      - name: Guardar descarga
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.download }}
          if-no-files-found: error
          retention-days: 30
      - name: Publicar paquete verificado
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_package.py "${{ matrix.download }}"
      - name: Guardar información de componentes
        if: always()
        shell: bash
        run: python -m pip freeze > componentes.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Componentes-${{ matrix.artifact }}
          path: componentes.txt
